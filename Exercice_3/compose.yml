---
name: Haxagone_SI_Exo3

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: tprevision
  nginx:
    image: nginx:alpine
    depends_on:
      - db
    ports:
      - "8002:8002"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
  