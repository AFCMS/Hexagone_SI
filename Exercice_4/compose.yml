---
name: Hexagone_SI_Exo3

services:
  crm:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crm
  erp:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: erp
  hr:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: password
  adminer:
    image: adminer:latest
    scale: 2
    depends_on:
      - crm
      - erp
      - hr
  nginx:
    image: nginx:alpine
    depends_on:
      - crm
      - erp
      - hr
      - adminer
    ports:
      - "8002:8002"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro